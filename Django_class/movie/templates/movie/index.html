<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
        
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between mb-3">
            <h2>Movie List</h2>
            <div>
                <a href="{% url 'movie_create' %}" class="btn btn-primary">
                    Add Movie
                </a>
                <a href="{% url 'category_create' %}" class="btn btn-primary">
                    Add Category
                </a>
            </div>
            
        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Release Date</th>
                    <th>Language</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for m in movie %}
                <tr>
                    <td>{{ m.name }}</td>
                    <td>
                        {% for c in m.category.all %}
                            {{ c.name }}{% if not forloop.last %}, {% endif %}
                        {% endfor %}
                    </td>
                    <td>{{ m.release_date }}</td>
                    <td>{{ m.language }}</td>
                    <td>
                        <a href="#" class="btn btn-success">
                            Update
                        </a>
                        <a href="#" class="btn btn-danger">
                            Delete
                        </a>

                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No movies found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
